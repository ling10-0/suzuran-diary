name: Build offline package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/offline-package
    paths:
      - 'src/**'
      - 'public/**'
      - 'offline/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/offline-package.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'offline/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/offline-package.yml'

permissions:
  contents: write

jobs:
  build-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build portable archive
        run: npm run build:offline

      - name: Verify archive isolation
        shell: bash
        run: |
          test -f 'offline-package/啟動遊戲.bat'
          test -f 'offline-package/offline-server.ps1'
          test -f 'offline-package/game/index.html'
          test -f 'offline-package/game/offline-map-tile.svg'
          test ! -d 'offline-package/game/server'
          test ! -d 'offline-package/game/.openai'
          grep -q 'offline=1' 'offline-package/offline-server.ps1'
          grep -q 'READY' 'offline-package/offline-server.ps1'
          grep -q '單機展示模式' 'offline-package/game/test-mode.js'
          python - <<'PY'
          from pathlib import Path
          data = Path('offline-package/offline-server.ps1').read_bytes()
          if any(byte > 127 for byte in data):
              raise SystemExit('offline-server.ps1 must remain ASCII-only for Windows PowerShell 5.1 compatibility')
          PY
          if grep -R --include='*.js' -n 'tile.openstreetmap.org' offline-package/game; then
            echo 'Offline package still contains an OpenStreetMap tile dependency.' >&2
            exit 1
          fi

      - name: Upload Windows offline package
        uses: actions/upload-artifact@v4
        with:
          name: suzuran-1938-offline-windows
          path: offline-package/
          if-no-files-found: error
          retention-days: 90

  windows-launcher-smoke:
    needs: build-offline
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download offline package
        uses: actions/download-artifact@v4
        with:
          name: suzuran-1938-offline-windows
          path: offline-package

      - name: Start launcher and verify localhost
        shell: powershell
        run: |
          $env:SUZURAN_OFFLINE_NO_BROWSER = '1'
          $env:SUZURAN_OFFLINE_PORT = '1938'
          $stdout = Join-Path $env:RUNNER_TEMP 'offline-server.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'offline-server.stderr.log'
          $script = Join-Path $PWD 'offline-package\offline-server.ps1'
          $proc = Start-Process powershell.exe -ArgumentList @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', $script
          ) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          $ok = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              if ($proc.HasExited) { break }
              try {
                $response = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:1938/?offline=1' -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match '1938') {
                  $ok = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }

            if (-not $ok) {
              Write-Host '--- stdout ---'
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host '--- stderr ---'
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Windows offline launcher smoke test failed.'
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

  publish-release:
    needs:
      - build-offline
      - windows-launcher-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified offline package
        uses: actions/download-artifact@v4
        with:
          name: suzuran-1938-offline-windows
          path: offline-package

      - name: Create shareable ZIP
        shell: bash
        run: |
          cd offline-package
          zip -r ../suzuran-1938-offline-windows.zip .

      - name: Publish stable offline release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f offline-latest "$GITHUB_SHA"
          git push origin refs/tags/offline-latest --force
          if gh release view offline-latest >/dev/null 2>&1; then
            gh release upload offline-latest suzuran-1938-offline-windows.zip --clobber
            gh release edit offline-latest \
              --title '翻閱1938｜Windows 單機展示版' \
              --notes '主管／後續實習生用的可攜式單機展示包。完整解壓縮後，雙擊「啟動遊戲.bat」即可。遊戲資料僅存本機，不寫入正式 Supabase。'
          else
            gh release create offline-latest suzuran-1938-offline-windows.zip \
              --title '翻閱1938｜Windows 單機展示版' \
              --notes '主管／後續實習生用的可攜式單機展示包。完整解壓縮後，雙擊「啟動遊戲.bat」即可。遊戲資料僅存本機，不寫入正式 Supabase。'
          fi
