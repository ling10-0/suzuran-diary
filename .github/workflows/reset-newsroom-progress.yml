name: Finish fresh newsroom reset

on:
  push:
    paths:
      - '.github/workflows/reset-newsroom-progress.yml'

permissions:
  contents: write

jobs:
  finish-reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ignore old local unlock records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.jsx')
          text = path.read_text(encoding='utf-8')
          old = "window.localStorage.getItem('suzuran-main-v2-unlocked-'+index)==='1'"
          new = "window.localStorage.getItem('suzuran-main-v3-unlocked-'+index)==='1'"
          if old not in text:
              raise SystemExit('Expected old local unlock key was not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git commit -m 'Ignore previous local unlock records for retest'
          git push
