name: Inspect newsroom progress

on:
  push:
    paths:
      - '.github/workflows/reset-newsroom-progress.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show current newsroom progress rows
        shell: bash
        run: |
          set -euo pipefail
          URL=$(grep "const supabaseUrl" src/sharedProgress.js | sed -E "s/.*= '([^']+)'.*/\1/")
          KEY=$(grep "const publishableKey" src/sharedProgress.js | sed -E "s/.*= '([^']+)'.*/\1/")
          ENDPOINT="$URL/rest/v1/newsroom_progress"

          for ROOM in '蘭臺' '見山' '迴聲'; do
            RESULT=$(curl --fail-with-body -sS -G "$ENDPOINT" \
              --data-urlencode 'select=newsroom,case_index,created_at' \
              --data-urlencode "newsroom=eq.$ROOM" \
              --data-urlencode 'order=case_index.asc' \
              -H "apikey: $KEY" \
              -H 'Accept: application/json')
            echo "$ROOM rows: $RESULT"
          done
