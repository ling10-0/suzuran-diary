name: Reset newsroom progress

on:
  push:
    paths:
      - '.github/workflows/reset-newsroom-progress.yml'

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete all three newsroom progress records
        shell: bash
        run: |
          set -euo pipefail
          URL=$(grep "const supabaseUrl" src/sharedProgress.js | sed -E "s/.*= '([^']+)'.*/\1/")
          KEY=$(grep "const publishableKey" src/sharedProgress.js | sed -E "s/.*= '([^']+)'.*/\1/")
          ENDPOINT="$URL/rest/v1/newsroom_progress"

          for ROOM in '蘭臺' '見山' '迴聲'; do
            curl --fail-with-body -sS -X DELETE -G "$ENDPOINT" \
              --data-urlencode "newsroom=eq.$ROOM" \
              -H "apikey: $KEY" \
              -H 'Prefer: return=minimal'
          done

          for ROOM in '蘭臺' '見山' '迴聲'; do
            RESULT=$(curl --fail-with-body -sS -G "$ENDPOINT" \
              --data-urlencode 'select=newsroom,case_index' \
              --data-urlencode "newsroom=eq.$ROOM" \
              -H "apikey: $KEY" \
              -H 'Accept: application/json')
            echo "$ROOM remaining rows: $RESULT"
            test "$RESULT" = '[]'
          done
