name: Fix Liuchuan map frame

on:
  push:
    paths:
      - '.github/workflows/fix-liuchuan-map-frame.yml'

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Liuchuan map inside its frame
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/puzzleLayoutOverrides.js')
          text = path.read_text(encoding='utf-8')

          old = """    .liuchuan-stage{scroll-margin-top:18px;padding-top:8px}.liuchuan-stage>header{margin-bottom:16px}.liuchuan-stage>header small{color:var(--gazette-red);font:11px 'DM Mono'}.liuchuan-stage>header h5{margin:6px 0 8px;padding:0;border:0;font-size:19px}
    .liuchuan-map-wrap{position:relative;min-height:360px;margin:16px 0;border:1px solid var(--gazette-rule);overflow:hidden;background:rgba(255,255,255,.14)}
    .liuchuan-map-image{display:block;width:100%;height:auto;max-height:560px;object-fit:contain}.liuchuan-map-image+.liuchuan-map-diagram{display:none}
    .liuchuan-map-diagram{position:relative;min-height:360px;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.22))}
"""
          new = """    .liuchuan-stage{scroll-margin-top:18px;padding-top:8px;min-width:0;overflow:hidden}.liuchuan-stage>header{width:100%;max-width:100%;box-sizing:border-box;margin:0 0 16px;overflow:hidden}.liuchuan-stage>header small{color:var(--gazette-red);font:11px 'DM Mono'}.liuchuan-stage>header h5{margin:6px 0 8px;padding:0;border:0;font-size:19px}
    .liuchuan-map-wrap{position:relative;width:min(100%,920px);max-width:100%;min-height:0;margin:16px auto;border:1px solid var(--gazette-rule);overflow:hidden;background:rgba(255,255,255,.14);box-sizing:border-box;line-height:0}
    .liuchuan-map-image{display:block;width:100%;max-width:100%;height:auto;max-height:none;margin:0;object-fit:contain}.liuchuan-map-image+.liuchuan-map-diagram{display:none}
    .liuchuan-map-diagram{position:relative;min-height:360px;line-height:normal;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.22))}
"""

          if old not in text:
              raise SystemExit('Expected Liuchuan map CSS block was not found')
          text = text.replace(old, new, 1)

          old_mobile = ".liuchuan-point-grid,.liuchuan-receipt-grid{grid-template-columns:1fr}.liuchuan-evidence-card,.liuchuan-receipt-grid article{grid-template-columns:1fr}.liuchuan-route-slots{grid-template-columns:repeat(2,1fr)}.liuchuan-map-wrap,.liuchuan-map-diagram{min-height:330px}.liuchuan-point{width:62px;height:62px}"
          new_mobile = ".liuchuan-point-grid,.liuchuan-receipt-grid{grid-template-columns:1fr}.liuchuan-evidence-card,.liuchuan-receipt-grid article{grid-template-columns:1fr}.liuchuan-route-slots{grid-template-columns:repeat(2,1fr)}.liuchuan-map-wrap{width:100%;min-height:0}.liuchuan-map-diagram{min-height:330px}.liuchuan-point{width:62px;height:62px}"

          if old_mobile not in text:
              raise SystemExit('Expected Liuchuan mobile CSS block was not found')
          text = text.replace(old_mobile, new_mobile, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/puzzleLayoutOverrides.js
          git commit -m 'Keep Liuchuan map inside its frame'
          git push
