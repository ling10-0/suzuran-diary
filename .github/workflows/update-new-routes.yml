name: Update New Routes

on:
  push:
    paths:
      - '.github/workflows/update-new-routes.yml'

permissions:
  contents: write

jobs:
  update-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply route updates
        run: python3 scripts/update_routes.py

      - name: Commit route updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx src/mainlineCases.js
          git commit -m 'Update first-day route and simplify second day'
          git push
