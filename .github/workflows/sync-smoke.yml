name: Sync smoke test

on:
  push:
    paths:
      - '.github/workflows/sync-smoke.yml'

jobs:
  test-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Test Supabase shared progress read/write
        shell: bash
        run: |
          set -euo pipefail
          URL='https://unyntuezvovodpklishf.supabase.co/rest/v1/newsroom_progress'
          KEY='sb_publishable_V-bPAyQBvzHTdRIPlDtbWQ_QYd3Jn1G'

          status=$(curl -sS -o /tmp/post.txt -w '%{http_code}' \
            -X POST "$URL?on_conflict=newsroom,case_index" \
            -H "apikey: $KEY" \
            -H 'Content-Type: application/json' \
            -H 'Prefer: resolution=ignore-duplicates,return=minimal' \
            --data '{"newsroom":"迴聲","case_index":1000}')
          echo "POST status: $status"
          cat /tmp/post.txt || true
          test "$status" = '201' || test "$status" = '204'

          status=$(curl -sS -o /tmp/get.txt -w '%{http_code}' \
            "$URL?select=case_index&newsroom=eq.%E8%BF%B4%E8%81%B2&case_index=eq.1000" \
            -H "apikey: $KEY" \
            -H 'Accept: application/json')
          echo "GET status: $status"
          cat /tmp/get.txt
          test "$status" = '200'
          grep -q '1000' /tmp/get.txt
