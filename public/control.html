<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>晚會即時通報控制台</title><style>body{margin:0;background:#17110d;color:#ead9b3;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{width:min(620px,calc(100% - 32px));margin:50px auto}.card{padding:26px;border:1px solid #866843;background:#211811;box-shadow:0 18px 60px #0008}small{letter-spacing:.16em;color:#b89667}h1{margin:8px 0 6px;font-size:30px}p{color:#c9b58f;line-height:1.7}label{display:grid;gap:7px;margin:17px 0;font-size:13px}input,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #755d3d;background:#100d0a;color:#f2dfb8;font:inherit}textarea{min-height:120px;resize:vertical}.preset{margin:20px 0;padding:16px;border:1px dashed #76593a;background:#18120e}.publish{width:100%;padding:16px;border:1px solid #b14a3c;background:#8f251d;color:#fff0cf;font-weight:900;font-size:17px;cursor:pointer}.publish:disabled{opacity:.45}.status{min-height:24px;margin-top:14px;font-size:13px}.back{display:inline-block;margin-top:18px;color:#d8bc89}</style></head><body><main class="wrap"><section class="card"><small>STAFF ONLY / 晚會控制</small><h1>市役所即時通報</h1><p>玩家只要仍開著遊戲網站，發布後約 3 秒內就會從手機畫面上方收到通知。</p><div class="preset"><b>預設劇情：鈴蘭失蹤</b><p>內容已經填好。晚會到指定時機時，輸入控制碼後按下發布即可。</p></div><label>控制碼<input id="code" type="password" inputmode="numeric" placeholder="四位數控制碼"></label><label>通知來源<input id="title" value="市役所・緊急通報"></label><label>通知標題<input id="body" value="鈴蘭失蹤"></label><label>點開後的完整內容<textarea id="detail">今日晚間起，鈴蘭失去聯絡，最後行蹤仍在確認中。

與《七－圖庫》相關之調查人員請暫停公開人物資訊，並留意市役所後續通報。</textarea></label><button class="publish" id="publish">發布給所有玩家</button><div class="status" id="status"></div><a class="back" href="./">← 回遊戲網站</a></section></main><script>const url='https://unyntuezvovodpklishf.supabase.co/rest/v1/rpc/publish_live_broadcast';const key='sb_publishable_V-bPAyQBvzHTdRIPlDtbWQ_QYd3Jn1G';const $=id=>document.getElementById(id);$('publish').onclick=async()=>{if(!confirm('確定現在要把「'+$('body').value+'」發布給所有在線玩家嗎？'))return;const btn=$('publish');btn.disabled=true;$('status').textContent='發布中…';try{const r=await fetch(url,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({p_code:$('code').value,p_title:$('title').value,p_body:$('body').value,p_detail:$('detail').value})});if(!r.ok)throw new Error(r.status===400?'控制碼錯誤或發布失敗':'發布失敗 '+r.status);$('status').textContent='✓ 已發布。玩家約 3 秒內會收到通報。';$('code').value=''}catch(e){$('status').textContent='✕ '+e.message}finally{btn.disabled=false}};</script></body></html>
