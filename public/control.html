<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>晚會即時通報控制台</title><style>body{margin:0;background:#17110d;color:#ead9b3;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{width:min(620px,calc(100% - 32px));margin:50px auto}.card{padding:26px;border:1px solid #866843;background:#211811;box-shadow:0 18px 60px #0008}small{letter-spacing:.16em;color:#b89667}h1{margin:8px 0 6px;font-size:30px}p{color:#c9b58f;line-height:1.7}label{display:grid;gap:7px;margin:17px 0;font-size:13px}input,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #755d3d;background:#100d0a;color:#f2dfb8;font:inherit}textarea{min-height:120px;resize:vertical}.preset{margin:20px 0;padding:16px;border:1px dashed #76593a;background:#18120e}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.publish{padding:16px;border:1px solid;font-weight:900;font-size:16px;cursor:pointer}.test{background:#315f62;border-color:#6da5a6;color:#efffff}.live{background:#8f251d;border-color:#d05b49;color:#fff0cf}.publish:disabled{opacity:.45}.warning{font-size:12px;color:#d7b27b}.status{min-height:24px;margin-top:14px;font-size:13px}.back{display:inline-block;margin-top:18px;color:#d8bc89}@media(max-width:520px){.actions{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card"><small>STAFF ONLY / 晚會控制</small><h1>市役所即時通報</h1><p>測試與正式發布已完全分流。測試訊息只會出現在開啟「測試模式」的玩家頁面；正式發布才會送給一般玩家。</p><div class="preset"><b>預設劇情：鈴蘭失蹤</b><p>晚會到指定時機時再使用紅色的「正式全體發布」。平常測試請只按藍綠色按鈕。</p></div><label>控制碼<input id="code" type="password" inputmode="numeric" placeholder="四位數控制碼"></label><label>通知來源<input id="title" value="市役所・緊急通報"></label><label>通知標題<input id="body" value="鈴蘭失蹤"></label><label>點開後的完整內容<textarea id="detail">今日晚間起，鈴蘭失去聯絡，最後行蹤仍在確認中。

與《七－圖庫》相關之調查人員請暫停公開人物資訊，並留意市役所後續通報。</textarea></label><div class="actions"><button class="publish test" id="test">🧪 發送測試推播</button><button class="publish live" id="live">🚨 正式全體發布</button></div><p class="warning">⚠ 正式全體發布會送到所有目前開著正式玩家網站的裝置。</p><div class="status" id="status"></div><a class="back" href="./">← 回遊戲網站</a></section></main><script>const base='https://unyntuezvovodpklishf.supabase.co/rest/v1/';const key='sb_publishable_V-bPAyQBvzHTdRIPlDtbWQ_QYd3Jn1G';const $=id=>document.getElementById(id);async function send(audience){const live=audience==='live';if(!confirm(live?'⚠ 這是正式發布！確定現在要把「'+$('body').value+'」送給所有正式玩家嗎？':'確定發送測試推播？只有測試模式裝置會收到。'))return;const btn=$(audience);btn.disabled=true;$('status').textContent='發布中…';try{const r=await fetch(base+'rpc/publish_live_broadcast',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({p_code:$('code').value,p_title:$('title').value,p_body:$('body').value,p_detail:$('detail').value})});if(!r.ok)throw new Error('控制碼錯誤或發布失敗');const id=await r.json();const r2=await fetch(base+'rpc/set_broadcast_audience',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({p_id:id,p_audience:audience})});if(!r2.ok)throw new Error('發布分流設定失敗');$('status').textContent=live?'✓ 已正式發布，正式玩家約 3 秒內收到。':'✓ 測試推播已送出，只有測試模式會收到。';$('code').value=''}catch(e){$('status').textContent='✕ '+e.message}finally{btn.disabled=false}}$('test').onclick=()=>send('test');$('live').onclick=()=>send('live');</script></body></html>
