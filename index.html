<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c72b30" />
    <title>翻閱1938：那些待續的章節</title>
    <link rel="stylesheet" href="/src/participant-info-compact.css" />
    <link rel="stylesheet" href="./onboarding.css" />
    <link rel="stylesheet" href="./story-layout-fix.css" />
    <link rel="stylesheet" href="./reporter-journal.css" />
    <link rel="stylesheet" href="./reporter-journal-current-fix.css" />
    <style>
      .newspaper-journal-page .four-reading-tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 14px;
      }

      .newspaper-journal-page .four-reading-tabs button {
        border-right: 0;
      }

      .newspaper-journal-page .four-reading-tabs button:nth-child(odd) {
        border-right: 1px solid var(--gazette-ink);
      }

      .newspaper-journal-page .four-reading-tabs button:nth-child(-n + 2) {
        border-bottom: 1px solid var(--gazette-ink);
      }

      /* 柳川第九題：讓地圖圖片與外框同寬，避免 max-height 把圖片縮窄後留下大面積空白。 */
      .newspaper-journal-page .case-question-sheet .liuchuan-stage {
        min-width: 0;
        overflow: hidden;
      }

      .newspaper-journal-page .case-question-sheet .liuchuan-stage > header {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        margin: 0 0 16px;
        overflow: hidden;
      }

      .newspaper-journal-page .case-question-sheet .liuchuan-map-wrap {
        width: min(100%, 920px);
        max-width: 100%;
        min-height: 0;
        margin: 16px auto;
        box-sizing: border-box;
        overflow: hidden;
        line-height: 0;
      }

      .newspaper-journal-page .case-question-sheet .liuchuan-map-image {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        max-height: none;
        margin: 0;
        object-fit: contain;
      }

      .newspaper-journal-page .case-question-sheet .liuchuan-map-diagram {
        line-height: normal;
      }

      @media (max-width: 800px) {
        .newspaper-journal-page .four-reading-tabs {
          margin-top: 24px;
        }

        .newspaper-journal-page .case-question-sheet .liuchuan-map-wrap {
          width: 100%;
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const recoveryKey = 'suzuran-app-recovery-attempted';
        const recoveryParam = '_app_refresh';

        const showRecoveryMessage = () => {
          const root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#eee9dd;color:#262c28;text-align:center"><section><h1 style="font-size:28px">案件資料載入未完成</h1><p style="line-height:1.8">案件沒有被刪除，請重新載入最新版本。</p><button type="button" onclick="sessionStorage.removeItem(\'' + recoveryKey + '\');location.reload()" style="border:1px solid #262c28;background:#fff;padding:12px 22px;cursor:pointer">重新載入案件</button></section></main>';
        };

        window.setTimeout(() => {
          const root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;

          try {
            if (!sessionStorage.getItem(recoveryKey)) {
              sessionStorage.setItem(recoveryKey, '1');
              const nextUrl = new URL(location.href);
              nextUrl.searchParams.set(recoveryParam, Date.now().toString());
              location.replace(nextUrl.toString());
              return;
            }
          } catch (_) {
            // Storage may be unavailable in privacy mode; the manual fallback still works.
          }

          showRecoveryMessage();
        }, 5000);
      })();
    </script>
    <script src="./test-mode.js"></script>
    <script src="./group-selection.js" defer></script>
    <script src="./onboarding.js" defer></script>
    <script src="./onboarding-guide-patch.js" defer></script>
    <script src="./reporter-journal-v2.js" defer></script>
    <script src="./reporter-journal-save-fix.js" defer></script>
    <script src="./reporter-journal-test-save-fix.js" defer></script>
    <script src="./reporter-journal-photo-options.js" defer></script>
    <script src="./reporter-journal-hide-booklet.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/src/revisedTravelCopy.js"></script>
    <script type="module" src="/src/puzzleLayoutOverrides.js"></script>
  </body>
</html>
